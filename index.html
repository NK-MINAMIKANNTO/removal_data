<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>除却データ分析ダッシュボード</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 25px;
        }
        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 15px;
        }
        .upload-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }
        .file-input-label {
            background: #667eea;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
            font-weight: 600;
        }
        .file-input-label:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .clear-button {
            background: #e74c3c;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            border: none;
            font-size: 14px;
        }
        .clear-button:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }
        .file-name {
            color: #666;
            font-size: 14px;
        }
        .period-filter {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .period-label {
            font-weight: 600;
            color: #667eea;
            font-size: 14px;
        }
        .period-button {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 13px;
        }
        .period-button:hover {
            background: #f0f4ff;
            transform: translateY(-2px);
        }
        .period-button.active {
            background: #667eea;
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .card-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        .card-subtitle {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .chart-container.full-width {
            grid-column: 1 / -1;
        }
        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        canvas {
            max-height: 400px;
        }
        .table-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-x: auto;
        }
        .cross-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
        }
        .cross-table thead th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 12px;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            position: sticky;
            top: 0;
            z-index: 10;
            border: none;
        }
        .cross-table thead th:first-child {
            border-radius: 10px 0 0 0;
        }
        .cross-table thead th:last-child {
            border-radius: 0 10px 0 0;
        }
        .cross-table tbody tr {
            transition: all 0.3s;
        }
        .cross-table tbody tr:hover {
            background: #f8f9ff;
            transform: scale(1.01);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }
        .cross-table tbody td {
            padding: 14px 12px;
            border-bottom: 1px solid #e8ecf4;
            text-align: center;
        }
        .cross-table tbody tr:last-child td {
            border-bottom: none;
        }
        .office-code {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
            display: inline-block;
            min-width: 50px;
        }
        .office-name {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        .amount-cell {
            background: #f0f4ff;
            border-radius: 8px;
            padding: 8px;
            margin: 2px;
        }
        .amount-value {
            color: #667eea;
            font-weight: 700;
            font-size: 14px;
            display: block;
        }
        .count-value {
            color: #999;
            font-size: 11px;
            margin-top: 2px;
        }
        .total-cell {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            border-radius: 8px;
            padding: 8px;
            margin: 2px;
        }
        .total-amount {
            color: #d63031;
            font-weight: 800;
            font-size: 15px;
            display: block;
        }
        .total-count {
            color: #2d3436;
            font-size: 12px;
            font-weight: 600;
            margin-top: 2px;
        }
        .zero-cell {
            color: #ddd;
            font-size: 12px;
        }
        .category-repair {
            border-left: 4px solid #d63031;
        }
        .category-rental {
            border-left: 4px solid #0984e3;
        }
        .category-replacement {
            border-left: 4px solid #6c5ce7;
        }
        .category-system {
            border-left: 4px solid #e84393;
        }
        .category-other {
            border-left: 4px solid #00b894;
        }
        .legend-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        .loading {
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 修理・代替機・レンタル費用 除却データ分析</h1>
            <div class="upload-section">
                <div class="file-input-wrapper">
                    <label for="csvFile" class="file-input-label">📁 別のCSVファイルを選択</label>
                    <input type="file" id="csvFile" accept=".csv" />
                </div>
                <button class="clear-button" id="clearButton">🔄 更新（キャッシュクリア）</button>
                <span class="file-name" id="fileName">読み込み中...</span>
            </div>
            <div class="period-filter">
                <span class="period-label">📅 期間フィルター:</span>
                <button class="period-button active" data-period="all">全期間</button>
                <div id="periodButtons"></div>
            </div>
        </div>
        <div class="summary-cards">
            <div class="card">
                <div class="card-title">💰 総除却金額</div>
                <div class="card-value" id="totalAmount">¥0</div>
                <div class="card-subtitle" id="totalAmountSubtitle">全期間合計</div>
            </div>
            <div class="card">
                <div class="card-title">📋 総件数</div>
                <div class="card-value" id="totalCount">0件</div>
                <div class="card-subtitle" id="totalCountSubtitle">全期間合計</div>
            </div>
            <div class="card">
                <div class="card-title">📊 平均単価</div>
                <div class="card-value" id="avgAmount">¥0</div>
                <div class="card-subtitle">1件あたり</div>
            </div>
            <div class="card">
                <div class="card-title">🏢 営業所数</div>
                <div class="card-value" id="officeCount">0拠点</div>
                <div class="card-subtitle">関与営業所</div>
            </div>
        </div>
        <div class="charts-grid">
            <div class="chart-container">
                <div class="chart-title">📈 品目分類別 金額・件数</div>
                <canvas id="categoryChart"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-title">📊 営業所別 件数ランキング</div>
                <canvas id="officeCountChart"></canvas>
            </div>
            <div class="chart-container full-width">
                <div class="chart-title">🏢 営業所別 除却金額ランキング</div>
                <canvas id="officeChart"></canvas>
            </div>
            <div class="chart-container full-width">
                <div class="chart-title">📅 月別推移</div>
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>
        <div class="table-container">
            <div class="chart-title">📊 営業所×品目分類 クロス集計</div>
            <div class="legend-container">
                <div class="legend-item">
                    <div class="legend-color" style="background: #d63031;"></div>
                    <span>修理</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #0984e3;"></div>
                    <span>レンタル</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #6c5ce7;"></div>
                    <span>代替機</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #e84393;"></div>
                    <span>システム品</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #00b894;"></div>
                    <span>その他</span>
                </div>
            </div>
            <table class="cross-table">
                <thead>
                    <tr>
                        <th>営業所コード</th>
                        <th>営業所名</th>
                        <th>🔧 修理</th>
                        <th>📦 レンタル</th>
                        <th>🔄 代替機</th>
                        <th>💻 システム品</th>
                        <th>📌 その他</th>
                        <th>💰 合計金額</th>
                        <th>📋 合計件数</th>
                    </tr>
                </thead>
                <tbody id="crossTableBody">
                    <tr>
                        <td colspan="9" style="padding: 40px; text-align: center; color: #999;">
                            <span class="loading">データを読み込んでいます...</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        // グローバル変数
        let categoryChartInstance = null;
        let officeCountChartInstance = null;
        let officeChartInstance = null;
        let monthlyChartInstance = null;
        let allData = []; // 全データを保持
        let currentPeriod = 'all'; // 現在選択中の期
        
        const chartColors = {
            primary: '#667eea',
            secondary: '#764ba2',
            success: '#00b894',
            warning: '#fdcb6e',
            danger: '#d63031',
            info: '#74b9ff',
            purple: '#a29bfe',
            pink: '#fd79a8'
        };
        
        // ページ読み込み時に自動でCSVを読み込む
        window.addEventListener('DOMContentLoaded', function() {
            fetch('removal_data.csv?v=' + Date.now(), {
                cache: 'no-store'
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('CSVファイルが見つかりません');
                    }
                    return response.text();
                })
                .then(data => {
                    parseCSV(data);
                    document.getElementById('fileName').textContent = 'removal_data.csv（自動読み込み）';
                })
                .catch(error => {
                    console.error('CSVファイルの読み込みエラー:', error);
                    document.getElementById('fileName').textContent = '※CSVファイルを手動でアップロードしてください';
                    document.getElementById('crossTableBody').innerHTML = `
                        <tr>
                            <td colspan="9" style="padding: 40px; text-align: center; color: #e74c3c;">
                                removal_data.csvが見つかりません。<br>別のCSVファイルをアップロードしてください。
                            </td>
                        </tr>
                    `;
                });
        });
        
        // 手動でCSVファイル読み込み
        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileName').textContent = file.name + '（手動アップロード）';
                const reader = new FileReader();
                reader.onload = function(event) {
                    parseCSV(event.target.result);
                };
                reader.readAsText(file, 'Shift-JIS');
            }
        });
        
        // 更新ボタン（キャッシュクリア）
        document.getElementById('clearButton').addEventListener('click', function() {
            if (confirm('ページを再読み込みして、データをクリアしますか？')) {
                window.location.reload();
            }
        });
        
        // CSVパース処理
        function parseCSV(csv) {
            const lines = csv.split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            
            allData = [];
            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim() === '') continue;
                
                const values = lines[i].split(',');
                if (values.length >= 7) {
                    allData.push({
                        period: values[0]?.trim() || '',
                        month: values[1]?.trim() || '',
                        officeCode: values[2]?.trim() || '',
                        officeName: values[3]?.trim() || '',
                        requester: values[4]?.trim() || '',
                        category: values[5]?.trim() || '',
                        amount: parseInt(values[6]?.trim().replace(/[^0-9]/g, '') || '0')
                    });
                }
            }
            
            if (allData.length > 0) {
                createPeriodButtons();
                analyzeData(allData);
            } else {
                alert('データが読み込めませんでした。CSVファイルの形式を確認してください。');
            }
        }
        
        // 期のボタンを動的に生成
        function createPeriodButtons() {
            const periods = [...new Set(allData.map(row => row.period))]
                .sort((a, b) => parseInt(a) - parseInt(b));

            const buttonContainer = document.getElementById('periodButtons');
            buttonContainer.innerHTML = '';
            
            periods.forEach(period => {
                const button = document.createElement('button');
                button.className = 'period-button';
                button.textContent = period;
                button.dataset.period = period;
                button.addEventListener('click', function() {
                    currentPeriod = period;
                    updateActivePeriodButton();
                    filterDataByPeriod(period);
                });
                buttonContainer.appendChild(button);
            });
            
            // 全期間ボタンのイベント
            document.querySelector('[data-period="all"]').addEventListener('click', function() {
                currentPeriod = 'all';
                updateActivePeriodButton();
                analyzeData(allData);
            });
        }
        
        // アクティブな期間ボタンの更新
        function updateActivePeriodButton() {
            document.querySelectorAll('.period-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-period="${currentPeriod}"]`).classList.add('active');
        }
        
        // 期でフィルタリング
        function filterDataByPeriod(period) {
            const filteredData = allData.filter(row => row.period === period);
            analyzeData(filteredData);
        }
        
        // データ分析処理
        function analyzeData(data) {
            // サマリーカード更新
            const totalAmount = data.reduce((sum, row) => sum + row.amount, 0);
            const totalCount = data.length;
            const avgAmount = totalCount > 0 ? Math.round(totalAmount / totalCount) : 0;
            const officeSet = new Set(data.map(row => row.officeCode));
            const officeCount = officeSet.size;
            
            document.getElementById('totalAmount').textContent = '¥' + totalAmount.toLocaleString();
            document.getElementById('totalCount').textContent = totalCount.toLocaleString() + '件';
            document.getElementById('avgAmount').textContent = '¥' + avgAmount.toLocaleString();
            document.getElementById('officeCount').textContent = officeCount + '拠点';
            
            // サブタイトル更新
            const subtitle = currentPeriod === 'all' ? '全期間合計' : currentPeriod + '合計';
            document.getElementById('totalAmountSubtitle').textContent = subtitle;
            document.getElementById('totalCountSubtitle').textContent = subtitle;
            
            // 品目分類別集計
            const categoryData = {};
            data.forEach(row => {
                if (!categoryData[row.category]) {
                    categoryData[row.category] = { amount: 0, count: 0 };
                }
                categoryData[row.category].amount += row.amount;
                categoryData[row.category].count += 1;
            });
            
            // 営業所別集計
            const officeData = {};
            data.forEach(row => {
                const key = row.officeCode + '|' + row.officeName;
                if (!officeData[key]) {
                    officeData[key] = { amount: 0, count: 0, code: row.officeCode, name: row.officeName };
                }
                officeData[key].amount += row.amount;
                officeData[key].count += 1;
            });
            
            // 月別集計
            const monthData = {};
            data.forEach(row => {
                if (!monthData[row.month]) {
                    monthData[row.month] = { amount: 0, count: 0 };
                }
                monthData[row.month].amount += row.amount;
                monthData[row.month].count += 1;
            });
            
            // 営業所×品目分類クロス集計
            const crossData = {};
            data.forEach(row => {
                const officeKey = row.officeCode + '|' + row.officeName;
                if (!crossData[officeKey]) {
                    crossData[officeKey] = {
                        code: row.officeCode,
                        name: row.officeName,
                        categories: {}
                    };
                }
                if (!crossData[officeKey].categories[row.category]) {
                    crossData[officeKey].categories[row.category] = { amount: 0, count: 0 };
                }
                crossData[officeKey].categories[row.category].amount += row.amount;
                crossData[officeKey].categories[row.category].count += 1;
            });
            
            // グラフとテーブル更新
            updateCategoryChart(categoryData);
            updateOfficeCharts(officeData);
            updateMonthlyChart(monthData);
            updateCrossTable(crossData);
        }
        
        // 品目分類別チャート更新
        function updateCategoryChart(categoryData) {
            const labels = Object.keys(categoryData);
            const amounts = labels.map(cat => Math.round(categoryData[cat].amount / 10000));
            const counts = labels.map(cat => categoryData[cat].count);
            
            if (categoryChartInstance) categoryChartInstance.destroy();
            
            categoryChartInstance = new Chart(document.getElementById('categoryChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '金額（万円）',
                        data: amounts,
                        backgroundColor: chartColors.primary,
                        yAxisID: 'y'
                    }, {
                        label: '件数',
                        data: counts,
                        backgroundColor: chartColors.warning,
                        yAxisID: 'y1'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        y: {
                            type: 'linear',
                            position: 'left',
                            title: { display: true, text: '金額（万円）' }
                        },
                        y1: {
                            type: 'linear',
                            position: 'right',
                            title: { display: true, text: '件数' },
                            grid: { drawOnChartArea: false }
                        }
                    }
                }
            });
        }
        
        // 営業所別チャート更新
        function updateOfficeCharts(officeData) {
            const offices = Object.values(officeData).sort((a, b) => b.amount - a.amount);
            const labels = offices.map(o => o.name);
            const amounts = offices.map(o => Math.round(o.amount / 10000));
            const counts = offices.map(o => o.count);
            
            const colors = [
                chartColors.primary, chartColors.secondary, chartColors.success,
                chartColors.warning, chartColors.danger, chartColors.info,
                chartColors.purple, chartColors.pink, '#95a5a6', '#7f8c8d',
                '#e67e22', '#16a085', '#2980b9', '#8e44ad', '#c0392b'
            ];
            
            // 件数ランキング（円グラフ）
            if (officeCountChartInstance) officeCountChartInstance.destroy();
            
            officeCountChartInstance = new Chart(document.getElementById('officeCountChart'), {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: counts,
                        backgroundColor: colors
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { position: 'right' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.label + ': ' + context.parsed + '件';
                                }
                            }
                        }
                    }
                }
            });
            
            // 金額ランキング（横棒グラフ）
            if (officeChartInstance) officeChartInstance.destroy();
            
            officeChartInstance = new Chart(document.getElementById('officeChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '除却金額（万円）',
                        data: amounts,
                        backgroundColor: colors
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        x: { 
                            beginAtZero: true, 
                            title: { display: true, text: '金額（万円）' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }
        
        // 月別推移チャート更新
        function updateMonthlyChart(monthData) {
            const sortedMonths = Object.keys(monthData)
                .sort((a, b) => parseInt(a) - parseInt(b));
            const labels = sortedMonths.map(m => {
                const month = m.substring(4, 6);
                return parseInt(month) + '月';
            });
            const amounts = sortedMonths.map(m => Math.round(monthData[m].amount / 10000));
            const counts = sortedMonths.map(m => monthData[m].count);
            
            if (monthlyChartInstance) monthlyChartInstance.destroy();
            
            monthlyChartInstance = new Chart(document.getElementById('monthlyChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '金額（万円）',
                        data: amounts,
                        borderColor: chartColors.primary,
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        fill: true,
                        tension: 0.4
                    }, {
                        label: '件数',
                        data: counts,
                        borderColor: chartColors.warning,
                        backgroundColor: 'rgba(253, 203, 110, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        y: { beginAtZero: true }
                    }
                },
                plugins: [{
                    id: 'customDataLabels',
                    afterDatasetsDraw: function(chart) {
                        const ctx = chart.ctx;
                        const dataset = chart.data.datasets[1];
                        const meta = chart.getDatasetMeta(1);
                        meta.data.forEach(function(point, index) {
                            const data = dataset.data[index];
                            if (data > 0) {
                                ctx.fillStyle = '#d63031';
                                ctx.font = 'bold 11px Arial';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'bottom';
                                ctx.fillText(data + '件', point.x, point.y - 5);
                            }
                        });
                    }
                }]
            });
        }
        
        // クロス集計テーブル更新
        function updateCrossTable(crossData) {
            const tbody = document.getElementById('crossTableBody');
            tbody.innerHTML = '';
            
            const offices = Object.values(crossData).sort((a, b) => {
                const totalA = Object.values(a.categories).reduce((sum, cat) => sum + cat.amount, 0);
                const totalB = Object.values(b.categories).reduce((sum, cat) => sum + cat.amount, 0);
                return totalB - totalA;
            });
            
            const allCategories = ['修理', 'レンタル', '代替機', 'システム品', 'その他'];
            
            offices.forEach(office => {
                const tr = document.createElement('tr');
                
                // 営業所コード
                const tdCode = document.createElement('td');
                tdCode.innerHTML = `<span class="office-code">${office.code}</span>`;
                tr.appendChild(tdCode);
                
                // 営業所名
                const tdName = document.createElement('td');
                tdName.innerHTML = `<span class="office-name">${office.name}</span>`;
                tr.appendChild(tdName);
                
                // 各品目分類
                let totalAmount = 0;
                let totalCount = 0;
                
                allCategories.forEach(category => {
                    const td = document.createElement('td');
                    td.className = `category-${getCategoryClass(category)}`;
                    
                    if (office.categories[category]) {
                        const cat = office.categories[category];
                        totalAmount += cat.amount;
                        totalCount += cat.count;
                        td.innerHTML = `
                            <div class="amount-cell">
                                <span class="amount-value">¥${cat.amount.toLocaleString()}</span>
                                <span class="count-value">${cat.count}件</span>
                            </div>
                        `;
                    } else {
                        td.innerHTML = '<span class="zero-cell">¥0 (0件)</span>';
                    }
                    tr.appendChild(td);
                });
                
                // 合計金額
                const tdTotal = document.createElement('td');
                tdTotal.innerHTML = `
                    <div class="total-cell">
                        <span class="total-amount">¥${totalAmount.toLocaleString()}</span>
                        <span class="total-count">${totalCount}件</span>
                    </div>
                `;
                tr.appendChild(tdTotal);
                
                // 合計件数
                const tdCount = document.createElement('td');
                tdCount.innerHTML = `<strong style="font-size: 16px; color: #667eea;">${totalCount}件</strong>`;
                tr.appendChild(tdCount);
                
                tbody.appendChild(tr);
            });
        }
        
        // カテゴリークラス名取得
        function getCategoryClass(category) {
            const map = {
                '修理': 'repair',
                'レンタル': 'rental',
                '代替機': 'replacement',
                'システム品': 'system',
                'その他': 'other'
            };
            return map[category] || 'other';
        }
    </script>
